name: agent-run

on:
  schedule:
    - cron: '30 1 * * *'      # 07:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install gptme

      - name: Run agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: openrouter/openrouter/free
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gptme --non-interactive --output-format json \
            "$(cat prompt.md)" | tee run.jsonl

      - name: Commit output
        if: always()
        run: |
          git config user.name  "agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f run.jsonl
          git add -A
          git diff --staged --quiet || git commit -m "run $(date -u +%F-%H%M)"
          git push
